<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Space Grotesk", sans-serif; }
        .glass-panel {
            background: rgba(5, 5, 5, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(18px);
        }
    </style>
</head>
<body class="min-h-screen bg-black px-4 py-10 text-white sm:px-8">
<main class="mx-auto max-w-xl">
    <a href="/tasks" class="text-sm text-orange-200 hover:text-orange-100">← Back to tasks</a>
    <section class="glass-panel mt-5 rounded-3xl p-6 sm:p-8">
        <p class="text-xs font-semibold uppercase tracking-[0.3em] text-orange-200">Task editor</p>
        <h1 class="mt-3 text-3xl font-bold">Edit task</h1>

        <div
                th:if="${error}"
                class="mt-5 rounded-xl border border-red-300/30 bg-red-500/20 px-4 py-3 text-sm text-red-100"
                th:text="${error}"
                role="alert">
            Could not update task.
        </div>

        <form
                th:action="@{/tasks/{id}/edit(id=${task.id})}"
                th:object="${taskForm}"
                method="post"
                class="mt-6 space-y-5">
            <div>
                <label for="title" class="mb-2 block text-sm font-medium text-white/80">Task title</label>
                <input
                        id="title"
                        type="text"
                        th:field="*{title}"
                        maxlength="200"
                        required
                        class="w-full rounded-xl border border-white/25 bg-black/40 px-4 py-3 text-white outline-none focus:border-orange-300">
            </div>
            <div>
                <label for="priority" class="mb-2 block text-sm font-medium text-white/80">Priority</label>
                <select
                        id="priority"
                        th:field="*{priority}"
                        class="w-full rounded-xl border border-white/25 bg-black/40 px-4 py-3 text-white outline-none focus:border-orange-300">
                    <option th:each="priorityOption : ${priorities}"
                            th:value="${priorityOption}"
                            th:text="${priorityOption}">
                        MEDIUM
                    </option>
                </select>
            </div>
            <div>
                <label for="category" class="mb-2 block text-sm font-medium text-white/80">Category</label>
                <input
                        id="category"
                        type="text"
                        th:field="*{category}"
                        maxlength="50"
                        required
                        class="w-full rounded-xl border border-white/25 bg-black/40 px-4 py-3 text-white outline-none focus:border-orange-300">
            </div>
            <div class="flex justify-end gap-3">
                <a href="/tasks" class="rounded-xl border border-white/20 px-5 py-3 text-sm font-semibold text-white/80 hover:bg-white/10">
                    Cancel
                </a>
                <button type="submit" class="rounded-xl bg-orange-500 px-5 py-3 text-sm font-bold hover:bg-orange-400">
                    Save changes
                </button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
